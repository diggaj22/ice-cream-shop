<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Order - Diggaj's Ice Cream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo serif gold-text">Diggaj's.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="cart.html" class="gold-text">Cart (<span id="cart-count">0</span>)</a></li>
            <li><a href="login.html" id="nav-login" class="btn-premium" style="padding: 0.5rem 1.5rem; font-size:0.8rem;">Login</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="glass-panel">
            <h2 class="serif" style="font-size: 2.5rem; margin-bottom: 2rem;">Your <span class="gold-text">Order</span></h2>
            
            <div id="cart-items-container">
                <!-- JS Injects Here -->
            </div>

            <div class="cart-total">
                <h3 class="serif" style="font-size: 2rem;">Total</h3>
                <h3 class="serif gold-text" style="font-size: 2.5rem;">₹<span id="cart-total-price">0</span></h3>
            </div>
            
            <div style="text-align: right; margin-top: 2rem;">
                <button class="btn-premium" onclick="App.checkout()" style="font-size: 1.2rem; padding: 1rem 3rem;">Secure Checkout 💳</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Embedded Logic to Prevent File Confusion -->
    <script>
        const App = {
            cart: JSON.parse(localStorage.getItem('diggaj_cart')) || [],
            user: localStorage.getItem('diggaj_user') || null,

            init() {
                this.updateCartCount();
                this.checkLoginStatus();
                this.renderCartPage();
            },

            toast(message) {
                let container = document.getElementById('toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toast-container';
                    document.body.appendChild(container);
                }
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `✨ ${message}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },

            removeFromCart(index) {
                this.cart.splice(index, 1);
                localStorage.setItem('diggaj_cart', JSON.stringify(this.cart));
                this.updateCartCount();
                this.renderCartPage();
                this.toast("Item removed. 🗑️");
            },

            updateCartCount() {
                const countElement = document.getElementById('cart-count');
                if (countElement) countElement.textContent = this.cart.length;
            },

            checkLoginStatus() {
                const loginBtn = document.getElementById('nav-login');
                if (this.user && loginBtn) {
                    loginBtn.textContent = this.user.toUpperCase();
                    loginBtn.href = '#';
                    loginBtn.onclick = (e) => {
                        e.preventDefault();
                        if (confirm(`Logged in as ${this.user}. Do you want to log out? 🚪`)) {
                            localStorage.removeItem('diggaj_user');
                            this.user = null;
                            this.toast("Logged out successfully! 👋");
                            setTimeout(() => window.location.href = 'index.html', 1000);
                        }
                    };
                }
            },

            checkout() {
                if (this.cart.length === 0) return this.toast("Your cart is empty! 🍦");
                if (!this.user) {
                    this.toast("Please log in to complete checkout! 🔒");
                    setTimeout(() => window.location.href = 'login.html', 1500);
                    return;
                }
                this.toast("Processing your premium order... 🎉");
                this.cart = [];
                localStorage.setItem('diggaj_cart', JSON.stringify([]));
                this.updateCartCount();
                this.renderCartPage();
            },

            renderCartPage() {
                const container = document.getElementById('cart-items-container');
                const totalSpan = document.getElementById('cart-total-price');
                if (!container) return;

                if (this.cart.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:3rem; color:#a1a1aa;">Your luxury cart is empty. 🍨</div>';
                    totalSpan.textContent = '0';
                    return;
                }

                let total = 0;
                container.innerHTML = this.cart.map((item, index) => {
                    total += item.price;
                    return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.img}" alt="${item.name}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;margin-right:1.5rem;">
                            <h3 class="serif">${item.name}</h3>
                        </div>
                        <div style="display:flex; align-items:center; gap:2rem;">
                            <p class="gold-text" style="font-size:1.5rem; font-weight:600;">₹${item.price}</p>
                            <button class="remove-btn" onclick="App.removeFromCart(${index})" style="color:#ff4757;background:none;border:none;font-size:1.1rem;cursor:pointer;">✕</button>
                        </div>
                    </div>`;
                }).join('');
                
                totalSpan.textContent = total;
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
