<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Collection - Diggaj's Ice Cream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo serif gold-text">Diggaj's.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            <li><a href="login.html" id="nav-login" class="btn-premium" style="padding: 0.5rem 1.5rem; font-size:0.8rem;">Login</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h2 class="serif">Signature <span class="gold-text">Collection</span></h2>
        <p style="color: var(--text-muted); font-size: 1.2rem;">Hand-crafted excellence in every scoop.</p>
    </div>

    <main class="menu-grid">
        <!-- Card 1 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1559703248-dcaaec9fab78?auto=format&fit=crop&w=800&q=80" alt="Vanilla" class="product-img">
            <div class="product-info">
                <h3 class="serif text-light">Madagascar Bean</h3>
                <p class="price">$8.50</p>
                <button class="btn-premium" onclick="App.addToCart(1, 'Madagascar Bean', 8.50, 'https://images.unsplash.com/photo-1559703248-dcaaec9fab78?auto=format&fit=crop&w=400&q=80')">Add to Order</button>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1563805042-7684c8e9e9cb?auto=format&fit=crop&w=800&q=80" alt="Chocolate" class="product-img">
            <div class="product-info">
                <h3 class="serif text-light">Midnight Truffle</h3>
                <p class="price">$9.00</p>
                <button class="btn-premium" onclick="App.addToCart(2, 'Midnight Truffle', 9.00, 'https://images.unsplash.com/photo-1563805042-7684c8e9e9cb?auto=format&fit=crop&w=400&q=80')">Add to Order</button>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1576506295286-5cda18df43e0?auto=format&fit=crop&w=800&q=80" alt="Pistachio" class="product-img">
            <div class="product-info">
                <h3 class="serif text-light">Bronte Pistachio</h3>
                <p class="price">$11.50</p>
                <button class="btn-premium" onclick="App.addToCart(3, 'Bronte Pistachio', 11.50, 'https://images.unsplash.com/photo-1576506295286-5cda18df43e0?auto=format&fit=crop&w=400&q=80')">Add to Order</button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
